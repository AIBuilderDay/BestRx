version: '3'

# BestRx - every command runs through Docker Compose so the app behaves the same for everyone.
# The frontend is the only service today; the backend slot is commented out in docker-compose.yml.

vars:
  FRONTEND_DIR: ./frontend
  FRONTEND_SERVICE: frontend
  FRONTEND_URL: http://localhost:5173
  BACKEND_DIR: ./backend
  INFRA_DIR: ./infra
  AWS_REGION: us-east-2
  AWS_PROFILE: default
  PREFIX: bestrx

tasks:
  default:
    desc: "Show available tasks"
    aliases: [help]
    silent: true
    cmds:
      - task --list

  start:
    desc: "Build and start everything (frontend at http://localhost:5173)"
    aliases: [up, dev]
    silent: true
    cmds:
      - task: _check_docker
      - docker compose up -d --build --remove-orphans
      - |
        echo ""
        echo "Waiting for the frontend to answer..."
        for i in $(seq 1 30); do
          if curl -sf {{.FRONTEND_URL}} > /dev/null 2>&1; then break; fi
          sleep 1
        done
        if curl -sf {{.FRONTEND_URL}} > /dev/null 2>&1; then
          echo "BestRx is up:  {{.FRONTEND_URL}}"
        else
          echo "Frontend has not answered yet. Check: task logs"
        fi
        echo ""
        echo "  task logs     tail container logs"
        echo "  task test     typecheck and unit tests"
        echo "  task stop     stop containers"

  stop:
    desc: "Stop containers (keeps images and node_modules)"
    aliases: [down]
    cmds:
      - docker compose down --remove-orphans

  restart:
    desc: "Full reset: clean:all, reinstall dependencies, start again"
    cmds:
      - task: clean:all
      - task: install
      - task: start

  logs:
    desc: "Tail container logs. Pass a service after --, e.g. task logs -- frontend"
    silent: true
    cmds:
      - docker compose logs -f --tail=100 {{.CLI_ARGS}}

  shell:
    desc: "Open a shell inside the frontend container"
    interactive: true
    cmds:
      - docker compose exec {{.FRONTEND_SERVICE}} sh

  install:
    desc: "Install dependencies on the host (for editor tooling and local test runs)"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm install

  test:
    desc: "Typecheck and run unit tests (frontend and backend)"
    cmds:
      - task: test:frontend
      - task: test:backend

  test:frontend:
    desc: "Typecheck and run frontend unit tests"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm exec tsc --noEmit
      - pnpm exec vitest run

  test:backend:
    desc: "Run backend unit tests"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run --extra dev --extra push pytest -q

  # ── Backend and infrastructure ───────────────────────────────────────────────

  backend:install:
    desc: "Create the backend virtualenv and install dependencies"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv venv --python 3.12
      - uv pip install -e ".[dev,push]"

  backend:dev:
    desc: "Run the API locally on :8000, serving JSON fixtures (no AWS needed)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  infra:build:
    desc: "Build the three Lambda deployment packages"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - ./scripts/build.sh

  infra:plan:
    desc: "Show what Terraform would change (creates nothing)"
    dir: "{{.INFRA_DIR}}"
    cmds:
      - terraform init -input=false
      - terraform plan

  infra:apply:
    desc: "Build the Lambdas and apply the Terraform stack"
    cmds:
      - task: infra:build
      - terraform -chdir={{.INFRA_DIR}} init -input=false
      - terraform -chdir={{.INFRA_DIR}} apply

  infra:seed:
    desc: "Load the JSON fixtures into DynamoDB (idempotent — rerun to reset a demo)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run python scripts/seed.py --prefix {{.PREFIX}} --region {{.AWS_REGION}} --profile {{.AWS_PROFILE}}

  infra:vapid:
    desc: "Generate the VAPID keypair into Secrets Manager (run once, after the first apply)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run python scripts/generate_vapid.py --secret-id {{.PREFIX}}/vapid --region {{.AWS_REGION}} --profile {{.AWS_PROFILE}}

  infra:env:
    desc: "Write frontend/.env pointing at the deployed stack"
    cmds:
      - terraform -chdir={{.INFRA_DIR}} output -raw frontend_env > {{.FRONTEND_DIR}}/.env
      - echo "Wrote {{.FRONTEND_DIR}}/.env"

  infra:destroy:
    desc: "Tear down the whole stack, including the tables and their data"
    dir: "{{.INFRA_DIR}}"
    cmds:
      - terraform destroy

  build:
    desc: "Production build (what a Cloudflare Pages deploy would run)"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm build

  clean:
    desc: "Stop containers and remove node_modules and build artifacts"
    silent: true
    cmds:
      - docker compose down --remove-orphans || true
      - rm -rf {{.FRONTEND_DIR}}/node_modules {{.FRONTEND_DIR}}/dist {{.FRONTEND_DIR}}/.vite node_modules
      # Future backend: uncomment when backend/ exists
      # - find ./backend -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
      # - rm -rf ./backend/.venv ./backend/.pytest_cache ./backend/.ruff_cache
      - echo "Cleaned node_modules and build artifacts."

  clean:all:
    desc: "clean plus Docker volumes, this project's images, and lockfiles"
    silent: true
    cmds:
      - docker compose down -v --remove-orphans --rmi local || true
      - task: clean
      - rm -rf pnpm-lock.yaml {{.FRONTEND_DIR}}/pnpm-lock.yaml
      - pnpm store prune || true
      - echo "Removed containers, volumes, local images, dependencies, and lockfiles."

  _check_docker:
    internal: true
    silent: true
    cmds:
      - |
        if ! docker info > /dev/null 2>&1; then
          echo "Docker is not running. Start Docker Desktop or Colima, then retry."
          exit 1
        fi
