services:
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: bestrx-frontend
    ports:
      # Loopback only: the dev server proxies /api/anthropic with the API key attached,
      # so it must not be reachable from other machines on the network.
      - "127.0.0.1:5173:5173"
    volumes:
      # Bind-mount the source for HMR, but keep the container's own node_modules.
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: node_modules/.bin/vite --host 0.0.0.0 --port 5173

  # ── Future backend ──────────────────────────────────────────────────────────
  # Python FastAPI, cloned in from our fast template when we need one. Until then the frontend
  # reads JSON fixtures from frontend/src/data/. Deployment target is Cloudflare Workers.
