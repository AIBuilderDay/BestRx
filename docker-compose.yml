services:
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: bestrx-frontend
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount the source for HMR, but keep the container's own node_modules.
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: node_modules/.bin/vite --host 0.0.0.0 --port 5173

  # ── Backend ─────────────────────────────────────────────────────────────────
  # FastAPI. Lives in ./backend and deploys to Lambda via ./infra.
  #
  # Uncommented it is optional: with no VITE_API_BASE_URL set, the frontend reads the JSON fixtures
  # in frontend/src/data/ and behaves exactly as it did before a backend existed.
  #
  # With no AWS environment configured the API serves those same fixtures and keeps writes in
  # memory, so this needs no credentials to run.
  #
  # backend:
  #   build:
  #     context: ./backend
  #   container_name: bestrx-backend
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/app
  #   command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  #
  # And set this on the frontend service so it calls the API instead of the fixtures:
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:8000
