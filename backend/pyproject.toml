[project]
name = "bestrx-backend"
version = "0.1.0"
description = "BestRx API: hospice DME catalog, orders, and order status notifications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
    # SQS (enqueue a push) and DynamoDB (the subscriptions table the notification service reads).
    "boto3>=1.35.0",
    # Postgres, when DATABASE_URL is set: orders that survive a restart and are shared across
    # devices. Unset locally, where the in-memory store is used and this import never runs.
    "psycopg[binary,pool]>=3.2.0",
    # Postgres, when DATABASE_URL is set: orders that survive a restart and are shared across
    # devices. Unset locally, where the in-memory store is used and this import never runs.
    "psycopg[binary,pool]>=3.2.0",
    # The MCP surface mounted at /mcp, for the frontend's AI-assisted search bar.
    "fastmcp>=2.11.0",
    # The AI endpoints: rerank (structured output) and the agent's MCP tool loop.
    "anthropic>=0.69.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "moto[dynamodb,sqs]>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
