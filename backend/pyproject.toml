[project]
name = "bestrx-backend"
version = "0.1.0"
description = "BestRx API: hospice DME catalog, orders, and order status notifications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
    "mangum>=0.19.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
push = ["pywebpush>=2.0.0", "py-vapid>=1.9.0"]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "moto[dynamodb,sqs]>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
